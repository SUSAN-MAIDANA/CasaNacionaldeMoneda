<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Nacional de la Moneda de Potosí</title>

    <link rel="stylesheet" href="css/estilo.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        #canvasInicio {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: block;
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            pointer-events: none;
            padding-top: 80px;
        }

        .hero-content h1 {
            font-family: 'Cinzel', serif;
            font-size: 5vw;
            color: #D4AF37;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.8);
            margin-bottom: 20px;
            animation: fadeInUp 1.5s ease;
        }

        .hero-content p {
            font-size: 1.5vw;
            color: #fff;
            letter-spacing: 3px;
            margin-bottom: 40px;
            animation: fadeInUp 1.8s ease;
        }

        .btn-explorar {
            pointer-events: auto;
            padding: 18px 50px;
            background: rgba(74, 93, 90, 0.8);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid #D4AF37;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.4s ease;
            text-decoration: none;
            animation: fadeInUp 2.1s ease;
        }

        .btn-explorar:hover {
            background: #D4AF37;
            color: #1a1a1a;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.6);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: transform: translateY(0); }
        }

        .scroll-down {
            position: absolute;
            bottom: 30px;
            color: #D4AF37;
            font-size: 14px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
    </style>
</head>

<body>

    <nav>
        <div class="nav-logo">
            <img src="img/cara.png" alt="Casa de la Moneda">
            <span>CASA NACIONAL DE MONEDA</span>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html" class="active">INICIO</a></li>
            <li><a href="historia.html">HISTORIA</a></li>
            <li><a href="infraestructura.html">INFRAESTRUCTURA</a></li>
            <li><a href="monedas.html">MONEDAS</a></li>
            <li><a href="informacion.html">INFORMACIÓN</a></li>
        </ul>
    </nav>

    <canvas id="canvasInicio"></canvas>

    <div class="hero-content">
        <h1>Casa Nacional de la Moneda</h1>
        <p>EL CORAZÓN DE PLATA DE POTOSÍ</p>
        <a href="historia.html" class="btn-explorar">Explorar el Museo</a>
        <div class="scroll-down">⬇ Mueve el mouse para verla ⬇</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.Fog(0x1a1a1a, 5, 15);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 3);

        const canvas = document.getElementById('canvasInicio');
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        scene.add(new THREE.AmbientLight(0x4A5D5A, 0.5));
        const directionalLight = new THREE.DirectionalLight(0xD4AF37, 2);
        directionalLight.position.set(2, 2, 3);
        scene.add(directionalLight);
        const pointLight = new THREE.PointLight(0xD4AF37, 1, 10);
        pointLight.position.set(0, 0, 2);
        scene.add(pointLight);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 1.5;
        controls.maxDistance = 4;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;

        let model = null;
        let time = 0;
        const loader = new GLTFLoader();

        loader.load('careta.glb', function(gltf) {
            model = gltf.scene;
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            model.position.sub(center);
            model.scale.set(2.8, 2.8, 2.8);
            
            /* CAMBIO 1: VOLTEAR 180° PARA QUE MIRE DE FRENTE */
            model.rotation.y = Math.PI; 
            
            scene.add(model);
        });

        function animate() {
            requestAnimationFrame(animate);
            time += 0.02;

            if (model) {
                const zoom = Math.sin(time) * 0.3;
                camera.position.z = 3 + zoom;
                
                /* CAMBIO 2: GIRAR MAS RAPIDO */
                model.rotation.y += 0.008; 
                
                model.position.y = Math.sin(time * 2) * 0.1;
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>
</html>
